name: Validate calculator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure and embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET

          html = Path("index.html").read_text(encoding="utf-8")

          required = [
              "<!doctype html>",
              "</style>",
              "</head>",
              "<body>",
              "</body>",
              "</html>",
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing required HTML markers: " + ", ".join(missing))

          script_blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          scripts = [s for s in script_blocks if '"@context":"https://schema.org"' not in s and '"@type":"WebApplication"' not in s]
          if not scripts:
              raise SystemExit("No application JavaScript block found.")
          Path("/tmp/app.js").write_text("\n".join(scripts), encoding="utf-8")

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          if manifest.get("start_url") != "/neonatal-gir-calculator/":
              raise SystemExit("manifest start_url is unexpected.")
          ET.parse("sitemap.xml")

          jsonld_blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, flags=re.S|re.I)
          if not jsonld_blocks:
              raise SystemExit("No JSON-LD structured data found.")
          for block in jsonld_blocks:
              try:
                  json.loads(block)
              except json.JSONDecodeError as exc:
                  raise SystemExit("Invalid JSON-LD in index.html: " + str(exc))

          robots = Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap: https://amoxyclav.github.io/neonatal-gir-calculator/sitemap.xml" not in robots:
              raise SystemExit("robots.txt does not reference the expected sitemap.")

          guide_paths = [
              "guides/neonatal-gir-calculator.html",
              "guides/neonatal-fluid-nutrition-calculator.html",
              "guides/neonatal-fluid-mixer.html",
          ]
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")
          expected_urls = [
              "https://amoxyclav.github.io/neonatal-gir-calculator/",
              *["https://amoxyclav.github.io/neonatal-gir-calculator/" + p for p in guide_paths],
          ]
          missing_sitemap_urls = [u for u in expected_urls if u not in sitemap_text]
          if missing_sitemap_urls:
              raise SystemExit("Sitemap is missing expected URLs: " + ", ".join(missing_sitemap_urls))

          for path in guide_paths:
              guide = Path(path)
              if not guide.is_file():
                  raise SystemExit("Missing guide page: " + path)
              text = guide.read_text(encoding="utf-8")
              for marker in ["<!doctype html>", "<head>", "</head>", "<body>", "</body>", "</html>"]:
                  if marker not in text.lower():
                      raise SystemExit(f"Guide {path} is missing {marker}")
              if 'meta name="robots" content="index,follow"' not in text:
                  raise SystemExit(f"Guide {path} must remain indexable.")
              if 'rel="canonical"' not in text:
                  raise SystemExit(f"Guide {path} is missing a canonical URL.")

          print("HTML markers, manifest.json, sitemap.xml and guide pages validated.")
          nav_pages = re.findall(r'<a[^>]+href="#([^"]+)"[^>]+data-page="([^"]+)"', html)
          if not nav_pages:
              raise SystemExit("No calculator page navigation links found.")
          nav_ids = [x[1] for x in nav_pages]
          if any(x[0] != x[1] for x in nav_pages):
              raise SystemExit("Navigation href/data-page mismatch detected.")
          page_ids = re.findall(r'<section id="([^"]+)" class="page(?: active)?">', html)
          if not page_ids:
              raise SystemExit("No calculator page sections found.")
          if set(nav_ids) != set(page_ids):
              raise SystemExit("Navigation links and page sections do not match.")
          if ".page{display:none;scroll-margin-top:90px}.page.active{display:block}" not in html:
              raise SystemExit("Page visibility CSS is missing.")
          if "#home.page{display:block}" in html or "body:has(.page:target)" in html:
              raise SystemExit("Legacy CSS must not force the Home page to remain visible.")
          if "document.addEventListener('click',e=>" not in html or "activatePage(page,true)" not in html:
              raise SystemExit("Independent navigation event binding is missing.")
          if "window.addEventListener('popstate'" not in html or "window.addEventListener('hashchange'" not in html:
              raise SystemExit("Browser history navigation handlers are missing.")
          print("Navigation links, page sections and independent navigation binding validated.")

          pages = Path(".github/workflows/pages.yml").read_text(encoding="utf-8")
          if "workflow_run:" not in pages or 'workflows: ["Validate calculator"]' not in pages:
              raise SystemExit("GitHub Pages deployment must wait for the Validate calculator workflow.")
          if "github.event.workflow_run.conclusion == 'success'" not in pages:
              raise SystemExit("GitHub Pages deployment must require successful validation.")
          if "github.event.workflow_run.head_sha" not in pages:
              raise SystemExit("GitHub Pages must deploy the exact validated commit.")
          if "push:" in pages or "workflow_dispatch:" in pages:
              raise SystemExit("GitHub Pages workflow must not provide a validation-bypassing push/manual deployment path.")
          print("GitHub Pages deployment is gated on successful validation.")

          PY
          node --check /tmp/app.js
          node tests/calculation-regression.test.js

      - name: Browser smoke test
        run: |
          set -o pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/browser-smoke.test.cjs 2>&1 | tee /tmp/browser-smoke.log

      - name: Upload browser smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-log
          path: /tmp/browser-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate required site files
        run: |
          test -f index.html
          test -f manifest.json
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
          test -f guides/neonatal-gir-calculator.html
          test -f guides/neonatal-fluid-nutrition-calculator.html
          test -f guides/neonatal-fluid-mixer.html
          test -f about.html
          test -f tests/calculation-regression.test.js
          test -f tests/offline-android-check.py
          python3 tests/offline-android-check.py
          echo "Required site files and offline Android dependencies are validated."
