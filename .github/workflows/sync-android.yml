name: Sync validated web app to Android

on:
  workflow_run:
    workflows: ["Validate calculator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-android
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated website commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update Android web assets
        run: |
          git fetch origin android-apk-build
          git worktree add /tmp/android origin/android-apk-build
          cp index.html /tmp/android/index.html
          cp favicon.svg /tmp/android/favicon.svg
          cp manifest.json /tmp/android/manifest.json
          cp guides/neonatal-gir-calculator.html /tmp/android/guides/neonatal-gir-calculator.html
          cp guides/neonatal-fluid-nutrition-calculator.html /tmp/android/guides/neonatal-fluid-nutrition-calculator.html
          cp guides/neonatal-fluid-mixer.html /tmp/android/guides/neonatal-fluid-mixer.html
          # Keep the Android shell source and blue-drop launcher icon synchronized with the validated website commit.
          mkdir -p /tmp/android/android/app/src/main/java/com/neonatalgir/calculator
          mkdir -p /tmp/android/android/app/src/main/res/drawable
          mkdir -p /tmp/android/android/app/src/main/res/mipmap-anydpi
          mkdir -p /tmp/android/android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p /tmp/android/android/app/src/main/res/values
          cp android/app/src/main/AndroidManifest.xml /tmp/android/android/app/src/main/AndroidManifest.xml
          cp android/app/src/main/java/com/neonatalgir/calculator/MainActivity.java /tmp/android/android/app/src/main/java/com/neonatalgir/calculator/MainActivity.java
          cp android/app/src/main/res/drawable/launcher_foreground.xml android/app/src/main/res/drawable/nav_*.xml /tmp/android/android/app/src/main/res/drawable/launcher_foreground.xml
          cp android/app/src/main/res/drawable/nav_*.xml /tmp/android/android/app/src/main/res/drawable/
          cp android/app/src/main/res/mipmap-anydpi/ic_launcher.xml /tmp/android/android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml /tmp/android/android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml /tmp/android/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml /tmp/android/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp android/app/src/main/res/values/launcher_colors.xml /tmp/android/android/app/src/main/res/values/launcher_colors.xml

      - name: Commit synchronized assets
        working-directory: /tmp/android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg manifest.json guides/ android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/neonatalgir/calculator/MainActivity.java android/app/src/main/res/drawable/launcher_foreground.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/values/launcher_colors.xml
          if git diff --cached --quiet; then
            echo "Android web assets are already synchronized."
            exit 0
          fi
          git commit -m "Sync validated website to Android app"
          git push origin HEAD:android-apk-build

      - name: Trigger Android APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/android-apk.yml/dispatches" -f ref=android-apk-build
