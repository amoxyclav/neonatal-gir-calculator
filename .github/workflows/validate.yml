name: Validate calculator

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure and embedded JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET

          html = Path("index.html").read_text(encoding="utf-8")

          required = [
              "<!doctype html>",
              "</style>",
              "</head>",
              "<body>",
              "</body>",
              "</html>",
          ]
          missing = [x for x in required if x not in html]
          if missing:
              raise SystemExit("Missing required HTML markers: " + ", ".join(missing))

          script_blocks = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          scripts = [s for s in script_blocks if '"@context":"https://schema.org"' not in s and '"@type":"WebApplication"' not in s]
          if not scripts:
              raise SystemExit("No application JavaScript block found.")
          Path("/tmp/app.js").write_text("\n".join(scripts), encoding="utf-8")

          json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          ET.parse("sitemap.xml")

          guide_paths = [
              "guides/neonatal-gir-calculator.html",
              "guides/neonatal-fluid-nutrition-calculator.html",
              "guides/neonatal-fluid-mixer.html",
          ]
          sitemap_text = Path("sitemap.xml").read_text(encoding="utf-8")
          expected_urls = [
              "https://amoxyclav.github.io/neonatal-gir-calculator/",
              *["https://amoxyclav.github.io/neonatal-gir-calculator/" + p for p in guide_paths],
          ]
          missing_sitemap_urls = [u for u in expected_urls if u not in sitemap_text]
          if missing_sitemap_urls:
              raise SystemExit("Sitemap is missing expected URLs: " + ", ".join(missing_sitemap_urls))

          for path in guide_paths:
              guide = Path(path)
              if not guide.is_file():
                  raise SystemExit("Missing guide page: " + path)
              text = guide.read_text(encoding="utf-8")
              for marker in ["<!doctype html>", "<head>", "</head>", "<body>", "</body>", "</html>"]:
                  if marker not in text.lower():
                      raise SystemExit(f"Guide {path} is missing {marker}")
              if 'meta name="robots" content="index,follow"' not in text:
                  raise SystemExit(f"Guide {path} must remain indexable.")
              if 'rel="canonical"' not in text:
                  raise SystemExit(f"Guide {path} is missing a canonical URL.")

          print("HTML markers, manifest.json, sitemap.xml and guide pages validated.")
          PY
          node --check /tmp/app.js

      - name: Validate required site files
        run: |
          test -f index.html
          test -f manifest.json
          test -f robots.txt
          test -f sitemap.xml
          test -f favicon.svg
          test -f guides/neonatal-gir-calculator.html
          test -f guides/neonatal-fluid-nutrition-calculator.html
          test -f guides/neonatal-fluid-mixer.html
          echo "Required site files are present."
