name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-apk-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle calculator for offline use
        run: |
          mkdir -p android/app/src/main/assets/site/guides
          cp index.html about.html favicon.svg manifest.json android/app/src/main/assets/site/
          cp local-profile.js android/app/src/main/assets/site/local-profile.js
          cp guides/neonatal-gir-calculator.html guides/neonatal-fluid-nutrition-calculator.html guides/neonatal-fluid-mixer.html android/app/src/main/assets/site/guides/
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: neonatal-gir-calculator-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
