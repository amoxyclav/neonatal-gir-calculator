name: Sync validated web app to Android

on:
  workflow_run:
    workflows: ["Validate calculator"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated website commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Update Android web assets
        run: |
          git fetch origin android-apk-build
          git worktree add /tmp/android origin/android-apk-build
          cp index.html /tmp/android/index.html
          cp favicon.svg /tmp/android/favicon.svg
          cp manifest.json /tmp/android/manifest.json
          cp guides/neonatal-gir-calculator.html /tmp/android/guides/neonatal-gir-calculator.html
          cp guides/neonatal-fluid-nutrition-calculator.html /tmp/android/guides/neonatal-fluid-nutrition-calculator.html
          cp guides/neonatal-fluid-mixer.html /tmp/android/guides/neonatal-fluid-mixer.html

      - name: Commit synchronized assets
        working-directory: /tmp/android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg manifest.json guides/
          if git diff --cached --quiet; then
            echo "Android web assets are already synchronized."
            exit 0
          fi
          git commit -m "Sync validated website to Android app"
          git push origin HEAD:android-apk-build
